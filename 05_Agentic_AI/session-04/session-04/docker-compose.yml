services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${PG_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: agent_memory
    volumes:
      - agent_memory_pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d agent_memory"]
      interval: 3s
      retries: 20
volumes:
  agent_memory_pgdata:
